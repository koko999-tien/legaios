<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2563EB">
  <title>Không tìm thấy trang · Căn cứ Pháp lý Môi trường</title>
  <link rel="icon" href="/assets/icons/can-cu-phap-ly-moi-truong.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fa;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(680px,calc(100% - 32px));background:#fff;border:1px solid #e4e8ef;border-radius:16px;padding:32px}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
    .brand img{width:42px;height:42px}
    .brand b{display:block;font-family:Cambria,"Times New Roman",serif;font-size:18px}
    .brand span{color:#1f6b4c}
    .brand small{display:block;color:#667085;margin-top:3px}
    .code{font-size:12px;font-weight:800;letter-spacing:.12em;color:#2563eb}
    h1{font-family:Cambria,"Times New Roman",serif;font-size:36px;margin:8px 0 10px}
    p{color:#667085;line-height:1.65;margin:0 0 20px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px}
    .primary{background:#2563eb;color:#fff}.secondary{border:1px solid #e4e8ef;color:#172033;background:#fff}
    @media(prefers-color-scheme:dark){body{background:#0f141b;color:#f2f4f7}main{background:#161b22;border-color:#29313d}.brand small,p{color:#98a2b3}.secondary{background:#161b22;border-color:#29313d;color:#f2f4f7}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/assets/icons/can-cu-phap-ly-moi-truong.svg" alt=""><div><b>Căn cứ Pháp lý <span>Môi trường</span></b><small>Tra cứu · Rà soát · Hồ sơ · Thủ tục</small></div></div>
    <div class="code">LỖI 404</div>
    <h1>Không tìm thấy trang này</h1>
    <p>Địa chỉ có thể đã thay đổi hoặc liên kết không còn tồn tại. Bạn có thể quay về trang chủ để tiếp tục tra cứu.</p>
    <div class="actions"><a class="primary" href="/">Về trang chủ</a><a class="secondary" href="/#">Mở lại website</a></div>
  </main>
</body>
</html>
