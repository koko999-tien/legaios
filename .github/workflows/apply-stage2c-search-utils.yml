name: Apply Stage 2c search-utils extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2c-search-utils.mjs'
      - '.github/workflows/apply-stage2c-search-utils.yml'

permissions:
  contents: write

jobs:
  extract-search-utils:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract search utilities
        run: node tools/apply-stage2c-search-utils.mjs

      - name: Validate resulting application
        run: node tools/check-html.mjs index.html

      - name: Verify Stage 2c.1 structure
        shell: bash
        run: |
          test -s assets/js/search-utils.js
          grep -q 'src="assets/js/search-utils.js"' index.html
          grep -q 'function esc(s="")' assets/js/search-utils.js
          grep -q 'const SEARCH_SYNONYMS=' assets/js/search-utils.js
          grep -q 'const CLAUSE_PACK_V13=' assets/js/app.js
          if grep -q 'function esc(s="")' assets/js/app.js; then
            echo 'esc still exists in app.js' >&2
            exit 1
          fi
          git diff --check

      - name: Commit Stage 2c.1 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/search-utils.js
          if git diff --cached --quiet; then
            echo 'No Stage 2c.1 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate shared search and safety utilities'
          git push origin HEAD:dev
