name: Validate Căn cứ Pháp lý Môi trường

on:
  push:
    branches: [main, dev, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate index and local assets
        run: node tools/check-html.mjs index.html

      - name: Verify V14 module structure
        run: node tools/check-v14-structure.mjs

      - name: Gate core legal-data release metadata
        run: node tools/legal-data-release-gate.mjs

      - name: Check V15/V16 lazy, optional and serverless modules
        shell: bash
        run: |
          node --check assets/lazy/official-search.js
          node --check assets/lazy/workspace-data.js
          node --check assets/optional/grounded-ai-loader.js
          node --check assets/optional/grounded-ai.js
          node --check assets/optional/calendar-export-loader.js
          node --check assets/optional/calendar-export.js
          node --check assets/backup/full-backup-loader.js
          node --check assets/backup/full-backup.js
          node --check netlify/functions/official-search.mjs
          node --check netlify/functions/grounded-ai.mjs

      - name: Verify grounded AI server boundary
        run: node tools/grounded-ai-function-smoke.mjs

      - name: Generate self-contained static preview copy
        run: node tools/extract-single-file.mjs index.html .tmp/refactor-preview

      - name: Validate generated preview HTML
        run: node tools/check-html.mjs .tmp/refactor-preview/index.html

      - name: Check whitespace errors
        run: git diff --check
