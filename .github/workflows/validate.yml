name: Validate LegalOS

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production index.html
        run: node tools/check-html.mjs

      - name: Generate split-file refactor preview
        run: node tools/extract-single-file.mjs index.html .tmp/refactor-preview

      - name: Validate generated preview HTML
        run: node tools/check-html.mjs .tmp/refactor-preview/index.html
