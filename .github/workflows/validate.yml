name: Validate Căn cứ Pháp lý Môi trường

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Validate index and local assets
        run: node tools/check-html.mjs index.html

      - name: Verify V14 module structure
        run: node tools/check-v14-structure.mjs

      - name: Generate self-contained static preview copy
        run: node tools/extract-single-file.mjs index.html .tmp/refactor-preview

      - name: Validate generated preview HTML
        run: node tools/check-html.mjs .tmp/refactor-preview/index.html

      - name: Check whitespace errors
        run: git diff --check

      - name: Start local application server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/legalos-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/legalos-http.log
          exit 1

      - name: Run browser smoke tests
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: npm run test:browser

      - name: Run security smoke tests
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: npm run test:security
