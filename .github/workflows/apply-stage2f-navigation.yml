name: Apply Stage 2f navigation extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2f-navigation.mjs'
      - '.github/workflows/apply-stage2f-navigation.yml'

permissions:
  contents: write

jobs:
  extract-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract navigation runtime
        run: node tools/apply-stage2f-navigation.mjs
      - name: Validate resulting application
        run: node tools/check-html.mjs index.html
      - name: Verify Stage 2f.3 structure
        shell: bash
        run: |
          test -s assets/js/navigation.js
          grep -q 'src="assets/js/navigation.js"' index.html
          grep -q 'function go(' assets/js/navigation.js
          grep -q 'function docs(' assets/js/app.js
          if grep -q 'function syncHomeCleanMode(' assets/js/app.js; then
            echo 'navigation runtime still exists in app.js' >&2
            exit 1
          fi
          git diff --check
      - name: Commit Stage 2f.3 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/navigation.js
          if git diff --cached --quiet; then
            echo 'No Stage 2f.3 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate page navigation runtime'
          git push origin HEAD:dev
