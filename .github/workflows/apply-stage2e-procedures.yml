name: Apply Stage 2e procedure extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2e-procedures.mjs'
      - '.github/workflows/apply-stage2e-procedures.yml'

permissions:
  contents: write

jobs:
  extract-procedures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract procedure runtime
        run: node tools/apply-stage2e-procedures.mjs
      - name: Validate resulting application
        run: node tools/check-html.mjs index.html
      - name: Verify Stage 2e.1 structure
        shell: bash
        run: |
          test -s assets/js/procedures.js
          grep -q 'src="assets/js/procedures.js"' index.html
          grep -q 'function renderProcList()' assets/js/procedures.js
          grep -q 'function renderWorkspace()' assets/js/app.js
          if grep -q 'function renderProcList()' assets/js/app.js; then
            echo 'procedure runtime still exists in app.js' >&2
            exit 1
          fi
          git diff --check
      - name: Commit Stage 2e.1 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/procedures.js
          if git diff --cached --quiet; then
            echo 'No Stage 2e.1 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate procedure checklist runtime'
          git push origin HEAD:dev
