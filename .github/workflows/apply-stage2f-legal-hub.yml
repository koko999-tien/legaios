name: Apply Stage 2f legal-hub extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2f-legal-hub.mjs'
      - '.github/workflows/apply-stage2f-legal-hub.yml'

permissions:
  contents: write

jobs:
  extract-legal-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract legal hub
        run: node tools/apply-stage2f-legal-hub.mjs
      - name: Validate resulting application
        run: node tools/check-html.mjs index.html
      - name: Verify Stage 2f.1 structure
        shell: bash
        run: |
          test -s assets/js/legal-hub.js
          grep -q 'src="assets/js/legal-hub.js"' index.html
          grep -q 'const LEGAL_PACK_KEY=' assets/js/legal-hub.js
          grep -q 'function renderCoreKnowledge(' assets/js/legal-hub.js
          grep -q 'function renderLawHubTab(' assets/js/legal-hub.js
          grep -q 'function phaseLabel(' assets/js/app.js
          if grep -q 'const LEGAL_PACK_KEY=' assets/js/app.js; then
            echo 'legal hub still exists in app.js' >&2
            exit 1
          fi
          git diff --check
      - name: Commit Stage 2f.1 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/legal-hub.js
          if git diff --cached --quiet; then
            echo 'No Stage 2f.1 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate legal knowledge and update hub runtime'
          git push origin HEAD:dev
