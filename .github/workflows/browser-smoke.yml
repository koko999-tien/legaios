name: Browser smoke test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local LegalOS server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/legalos-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/legalos-http.log
          exit 1

      - name: Run browser smoke test
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/browser-smoke.mjs

      - name: Verify real mobile sidebar interaction
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/mobile-sidebar-interaction.mjs

      - name: Verify mobile article layout
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/mobile-article-layout.mjs
