name: Browser smoke test

on:
  push:
    branches: [dev, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enforce static performance budgets
        run: node tools/performance-budget.mjs

      - name: Install Playwright and axe
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium

      - name: Start local Căn cứ Pháp lý Môi trường server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/legalos-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/legalos-http.log
          exit 1

      - name: Run browser smoke test
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/browser-smoke.mjs

      - name: Verify sticky application header
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/header-sticky-smoke.mjs

      - name: Verify V14 UX polish
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/ux-polish-smoke.mjs

      - name: Verify core legal trust metadata
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/legal-trust-smoke.mjs

      - name: Verify legal search quality
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/search-quality.mjs

      - name: Verify Search V4 official-source boundary
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/official-search-smoke.mjs

      - name: Verify structured legal comparison
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/compare-smoke.mjs

      - name: Verify privacy-preserving diagnostics
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/diagnostics-smoke.mjs

      - name: Verify imported-HTML sanitizer
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/security-sanitizer.mjs

      - name: Verify IndexedDB persistence
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/idb-storage.mjs

      - name: Verify workspace and reading data safety
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/data-safety-smoke.mjs

      - name: Verify compliance workspace
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/compliance-smoke.mjs

      - name: Verify real mobile sidebar interaction
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/mobile-sidebar-interaction.mjs

      - name: Verify mobile article layout
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/mobile-article-layout.mjs

      - name: Verify smart reading progress
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/reading-progress-smoke.mjs

      - name: Verify offline PWA shell
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/pwa-smoke.mjs

      - name: Accessibility smoke test
        env:
          LEGALOS_URL: http://127.0.0.1:4173/
        run: node tools/accessibility-smoke.mjs
