name: Apply Stage 2g boot extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2g-boot.mjs'
      - '.github/workflows/apply-stage2g-boot.yml'

permissions:
  contents: write

jobs:
  extract-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract boot runtime
        run: node tools/apply-stage2g-boot.mjs
      - name: Validate resulting application
        run: node tools/check-html.mjs index.html
      - name: Verify Stage 2g structure
        shell: bash
        run: |
          test -s assets/js/boot.js
          test ! -e assets/js/app.js
          grep -q 'src="assets/js/boot.js"' index.html
          grep -q 'DOMContentLoaded' assets/js/boot.js
          grep -q 'function analyze()' assets/js/classifier.js
          grep -q 'function docs(' assets/js/library-search.js
          git diff --check
      - name: Commit Stage 2g extraction
        shell: bash
        run: |
          git add -A index.html assets/js/app.js assets/js/boot.js
          if git diff --cached --quiet; then
            echo 'No Stage 2g changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate final application boot runtime'
          git push origin HEAD:dev
