name: Apply Stage 2d project-tools extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2d-project-tools.mjs'
      - '.github/workflows/apply-stage2d-project-tools.yml'

permissions:
  contents: write

jobs:
  extract-project-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract project tools
        run: node tools/apply-stage2d-project-tools.mjs
      - name: Validate resulting application
        run: node tools/check-html.mjs index.html
      - name: Verify Stage 2d.3 structure
        shell: bash
        run: |
          test -s assets/js/project-tools.js
          grep -q 'src="assets/js/project-tools.js"' index.html
          grep -q 'function renderUpdates(' assets/js/project-tools.js
          grep -q 'function caseExport(' assets/js/project-tools.js
          grep -q 'function toast(' assets/js/app.js
          if grep -q 'function renderUpdates(' assets/js/app.js; then
            echo 'project tools still exist in app.js' >&2
            exit 1
          fi
          git diff --check
      - name: Commit Stage 2d.3 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/project-tools.js
          if git diff --cached --quiet; then
            echo 'No Stage 2d.3 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate project update and screening tools'
          git push origin HEAD:dev
