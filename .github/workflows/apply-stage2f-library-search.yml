name: Apply Stage 2f library-search extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2f-library-search.mjs'
      - '.github/workflows/apply-stage2f-library-search.yml'

permissions:
  contents: write

jobs:
  extract-library-search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract library search renderer
        run: node tools/apply-stage2f-library-search.mjs
      - name: Validate resulting application
        run: node tools/check-html.mjs index.html
      - name: Verify Stage 2f.4 structure
        shell: bash
        run: |
          test -s assets/js/library-search.js
          grep -q 'src="assets/js/library-search.js"' index.html
          grep -q 'function docs(' assets/js/library-search.js
          grep -q 'function analyze()' assets/js/app.js
          if grep -q 'function docs(' assets/js/app.js; then
            echo 'library search renderer still exists in app.js' >&2
            exit 1
          fi
          git diff --check
      - name: Commit Stage 2f.4 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/library-search.js
          if git diff --cached --quiet; then
            echo 'No Stage 2f.4 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate document-library search rendering'
          git push origin HEAD:dev
