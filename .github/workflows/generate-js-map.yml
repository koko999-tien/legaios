name: Generate JavaScript dependency map

on:
  push:
    branches: [dev]
    paths:
      - 'tools/analyze-app-js.mjs'
      - '.github/workflows/generate-js-map.yml'

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate dependency inventory
        run: node tools/analyze-app-js.mjs

      - name: Validate current application
        run: node tools/check-html.mjs index.html

      - name: Commit dependency inventory
        shell: bash
        run: |
          git add docs/JS_DEPENDENCIES.md
          if git diff --cached --quiet; then
            echo 'Dependency inventory is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: map JavaScript dependencies for Stage 2b'
          git push origin HEAD:dev
