name: Apply Stage 1 CSS extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage1-css.mjs'
      - '.github/workflows/apply-stage1-css.yml'

permissions:
  contents: write

jobs:
  extract-css:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract application CSS
        run: node tools/apply-stage1-css.mjs

      - name: Validate resulting HTML
        run: node tools/check-html.mjs index.html

      - name: Verify Stage 1 structure
        shell: bash
        run: |
          test -s assets/css/app.css
          grep -q 'href="assets/css/app.css"' index.html
          if grep -qi '<style' index.html; then
            echo 'Inline <style> remains in index.html' >&2
            exit 1
          fi
          git diff --check

      - name: Commit Stage 1 extraction
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/css/app.css; then
            echo 'No Stage 1 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css/app.css
          git commit -m 'refactor: extract application CSS'
          git push origin HEAD:dev
