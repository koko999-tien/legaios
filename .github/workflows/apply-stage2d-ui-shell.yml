name: Apply Stage 2d UI-shell extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2d-ui-shell.mjs'
      - '.github/workflows/apply-stage2d-ui-shell.yml'

permissions:
  contents: write

jobs:
  extract-ui-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract UI shell
        run: node tools/apply-stage2d-ui-shell.mjs

      - name: Validate resulting application
        run: node tools/check-html.mjs index.html

      - name: Verify Stage 2d.1 structure
        shell: bash
        run: |
          test -s assets/js/ui-shell.js
          grep -q 'src="assets/js/ui-shell.js"' index.html
          grep -q 'function renderHomePortal(' assets/js/ui-shell.js
          grep -q 'function currentPage()' assets/js/app.js
          if grep -q 'function renderHomePortal(' assets/js/app.js; then
            echo 'UI shell still exists in app.js' >&2
            exit 1
          fi
          git diff --check

      - name: Commit Stage 2d.1 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/ui-shell.js
          if git diff --cached --quiet; then
            echo 'No Stage 2d.1 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate shell UI and wizard runtime'
          git push origin HEAD:dev
