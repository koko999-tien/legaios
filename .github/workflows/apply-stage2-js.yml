name: Apply Stage 2 JavaScript extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2-js.mjs'
      - '.github/workflows/apply-stage2-js.yml'

permissions:
  contents: write

jobs:
  extract-js:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract application JavaScript
        run: node tools/apply-stage2-js.mjs

      - name: Validate resulting application
        run: node tools/check-html.mjs index.html

      - name: Verify Stage 2a structure
        shell: bash
        run: |
          test -s assets/js/app.js
          grep -q 'src="assets/js/app.js"' index.html
          git diff --check

      - name: Commit Stage 2a extraction
        shell: bash
        run: |
          if git diff --quiet -- index.html assets/js/app.js; then
            echo 'No Stage 2a changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/js/app.js
          git commit -m 'refactor: extract application JavaScript'
          git push origin HEAD:dev
