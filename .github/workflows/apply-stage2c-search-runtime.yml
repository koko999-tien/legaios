name: Apply Stage 2c search-runtime extraction

on:
  push:
    branches: [dev]
    paths:
      - 'tools/apply-stage2c-search-runtime.mjs'
      - '.github/workflows/apply-stage2c-search-runtime.yml'

permissions:
  contents: write

jobs:
  extract-search-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract search runtime
        run: node tools/apply-stage2c-search-runtime.mjs

      - name: Validate resulting application
        run: node tools/check-html.mjs index.html

      - name: Verify Stage 2c.3 structure
        shell: bash
        run: |
          test -s assets/js/search-runtime.js
          grep -q 'src="assets/js/search-runtime.js"' index.html
          grep -q 'function legalSearchScore(' assets/js/search-runtime.js
          grep -q 'function runInDocSearch(' assets/js/search-runtime.js
          grep -q 'function currentPage()' assets/js/app.js
          if grep -q 'function legalSearchScore(' assets/js/app.js; then
            echo 'search runtime still exists in app.js' >&2
            exit 1
          fi
          git diff --check

      - name: Commit Stage 2c.3 extraction
        shell: bash
        run: |
          git add index.html assets/js/app.js assets/js/search-runtime.js
          if git diff --cached --quiet; then
            echo 'No Stage 2c.3 changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: isolate legal search and memo runtime'
          git push origin HEAD:dev
