[build]
  publish = "."

[context.deploy-preview]
  command = "node tools/extract-single-file.mjs index.html .tmp/refactor-preview"
  publish = ".tmp/refactor-preview"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
